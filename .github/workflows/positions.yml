name: Refresh position data

# Recomputes the Active Positions board from real market data so the numbers
# on the site were true that morning rather than whenever they were typed.
on:
  schedule:
    # 09:20 UTC on weekdays — after the previous US session has settled
    - cron: "20 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: positions
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet yfinance pandas numpy lxml html5lib

      - name: Rebuild positions.json
        run: python vault/data/build_positions.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- vault/data/positions.json; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vault/data/positions.json
          git commit -m "data: refresh positions $(date -u +%Y-%m-%d)"
          git push
